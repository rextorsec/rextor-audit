<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Rextor Audit — Audits are point-in-time. Code is continuous.">
  <defs>
    <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#10d39a" opacity="0.07"/>
    </pattern>
    <radialGradient id="gridfade" cx="35%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1280" height="640" fill="url(#gridfade)"/></mask>
  </defs>

  <rect width="1280" height="640" fill="#070a09"/>
  <rect width="1280" height="640" fill="url(#dotgrid)" mask="url(#gridmask)"/>

  <text x="72" y="96" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="4" fill="#a4a9a6">REXTOR AUDIT — PR-TIME AUDIT AGENT</text>

  <text x="68" y="192" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#e4e9e7">Audits are point-in-time.</text>
  <text x="68" y="268" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#10d39a">Code is continuous.</text>

  <text x="72" y="324" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#a4a9a6">Every pull request that touches money-code becomes an audit event —</text>
  <text x="72" y="354" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#a4a9a6">analyzed, fork-simulated, scored, and attested on-chain.</text>

  <line x1="72" y1="528" x2="1208" y2="528" stroke="#1c201e" stroke-width="1"/>
  <text x="72" y="568" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="1" fill="#6b706d">rextoraudit.com</text>
  <circle cx="668" cy="563" r="4" fill="#10d39a"/>
  <text x="684" y="568" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#858b88">Tempo · HyperEVM · Solana · ERC-8004 50891</text>
</svg>
