<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Pipeline: PR in, five stages, verdict anchored on-chain.">
  <style>
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>

  <rect width="1200" height="560" fill="#070a09"/>

  <!-- input chip -->
  <rect x="80" y="52" width="230" height="44" rx="8" fill="none" stroke="#2f3432" stroke-width="1"/>
  <circle class="pulse" cx="104" cy="74" r="4" fill="#10d39a"/>
  <text x="120" y="79" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e4e9e7">GitHub pull request</text>
  <text x="326" y="80" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#6b706d">&#8594;</text>

  <!-- hairline connector above the stage row -->
  <line x1="80" y1="150" x2="1120" y2="150" stroke="#2f3432" stroke-width="1"/>

  <!-- stage 1.0 -->
  <g>
    <text x="80" y="130" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#6b706d">1.0</text>
    <text x="80" y="192" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e4e9e7">Scope</text>
    <text x="80" y="222" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a4a9a6">Diff &#8594; changed functions,</text>
    <text x="80" y="244" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a4a9a6">callsites, trust-boundary</text>
    <text x="80" y="266" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a4a9a6">deltas</text>
  </g>

  <!-- stage 2.0 -->
  <g>
    <text x="280" y="130" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#6b706d">2.0</text>
    <text x="280" y="192" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e4e9e7">Analyze</text>
    <text x="280" y="222" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a4a9a6">Slither + Aderyn in Docker,</text>
    <text x="280" y="244" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a4a9a6">sandboxed &#8212; deterministic</text>
    <text x="280" y="266" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a4a9a6">pass over the diff</text>
  </g>

  <!-- stage 3.0 -->
  <g>
    <text x="480" y="130" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#6b706d">3.0</text>
    <text x="480" y="192" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e4e9e7">Triage</text>
    <text x="480" y="222" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a4a9a6">LLM, citation-constrained;</text>
    <text x="480" y="244" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a4a9a6">tool failure &#8594; INCOMPLETE,</text>
    <text x="480" y="266" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a4a9a6">never a clean pass</text>
  </g>

  <!-- stage 4.0 -->
  <g>
    <text x="720" y="130" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#6b706d">4.0</text>
    <text x="720" y="192" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e4e9e7">Prove</text>
    <text x="720" y="222" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a4a9a6">Fork-sim PoC per finding</text>
    <text x="720" y="244" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a4a9a6">(liteSVM / Foundry) &#8212;</text>
    <text x="720" y="266" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a4a9a6">execution, not vibes</text>
  </g>

  <!-- stage 5.0 -->
  <g>
    <text x="960" y="130" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#6b706d">5.0</text>
    <text x="960" y="192" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e4e9e7">Score</text>
    <text x="960" y="222" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a4a9a6">Deterministic rubric &#8594;</text>
    <text x="960" y="244" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a4a9a6">riskScore, recomputable</text>
    <text x="960" y="266" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a4a9a6">by anyone</text>
  </g>

  <!-- arrows between stages -->
  <text x="243" y="190" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#6b706d">&#8594;</text>
  <text x="443" y="190" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#6b706d">&#8594;</text>
  <text x="683" y="190" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#6b706d">&#8594;</text>
  <text x="923" y="190" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#6b706d">&#8594;</text>

  <!-- anchor terminal bar -->
  <rect x="80" y="330" width="1040" height="120" rx="10" fill="#0e1110" stroke="#10d39a" stroke-width="1"/>
  <circle class="pulse" cx="116" cy="366" r="4" fill="#10d39a"/>
  <text x="132" y="371" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#10d39a">ANCHOR &#8212; THE VERDICT LANDS ON-CHAIN</text>
  <text x="112" y="404" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a4a9a6">attest(reviewId, commitHash, findingsHash, riskScore, status) &#8212; native to the target chain</text>
  <text x="112" y="430" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#6b706d">Tempo &#183; HyperEVM &#183; Solana &#8212; agent identity: ERC-8004 agentId 50891</text>

  <!-- outputs -->
  <text x="80" y="496" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#858b88">&#8594; PR comment with findings + evidence</text>
  <text x="480" y="496" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#858b88">&#8594; merge-gating check-run</text>
  <text x="850" y="496" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#858b88">&#8594; public attestation</text>
</svg>
