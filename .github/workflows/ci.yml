# Root CI — enforces what the conventions promise: typecheck + hermetic tests
# on every PR and push, gitleaks over full history, and an advisory
# dependency-audit signal. pull_request ONLY (never pull_request_target: PR
# content must never get access to secrets).
#
# The docker-contract tests (analyzer image, sim harness) run in a separate
# NON-GATING job: they depend on a freshly built image whose toolchain layers
# (foundryup, solc-select transitives) are not yet hermetic on GH runners —
# so they are a visible signal, not a merge gate. The deployment host builds
# and contract-verifies its own image (both architectures verified locally).
# Post-CWF: publish the image to ghcr by digest, pin CI to it, and flip this
# job to blocking.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (turbo, all packages)
        run: pnpm typecheck

      - name: Tests (turbo, all packages — hermetic; container contracts run in the contract job)
        env:
          REXTOR_SKIP_CONTRACT_TESTS: "1"
        run: pnpm test:run

      # Advisory, non-blocking while next@14 remains (tracked upgrade:
      # next@>=15.5.24 post-CWF). Flip to blocking after the upgrade.
      - name: Dependency audit (advisory)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  contract:
    runs-on: ubuntu-latest
    continue-on-error: true # non-gating until the image ships hermetically (see header)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build analyzer image
        run: docker build -t rextor/analyzer packages/agent/analyzer

      - name: Container contract tests (analyzer + sim)
        run: pnpm --filter @rextor/agent exec vitest run test/analyzer.contract.test.ts test/sim.contract.test.ts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — a leak that was added and removed still counts

      # gitleaks/gitleaks-action v2 requires a paid license for organizations —
      # run the pinned upstream binary directly instead (no license, same scan).
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --report-path /tmp/gitleaks-report.json
