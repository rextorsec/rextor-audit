[package]
name = "attestation-solana"
version = "0.1.0"
edition = "2021"

[lib]
name = "attestation_solana"
crate-type = ["cdylib", "lib"]

[features]
idl-build = ["anchor-lang/idl-build"]

# SPEC-8 §6 — anchor CLI pinned to 0.31.1 via avm (2026-09-19; ratified by
# RECTOR 2026-09-22): the 0.30 line cannot build on a modern dep graph
# (anchor-syn 0.30.1 IDL path uses proc-macro2's removed Span::source_file),
# and 0.31.1 matches the Gate-B fixture's anchor-lang. init-if-needed: the
# re-initialization hazard is closed by construction — the review PDA is
# program-derived from review_id and the conflict branch rejects any
# non-identical replay.
[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
